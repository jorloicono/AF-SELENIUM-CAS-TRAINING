<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Selectable - Selenium Practice</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .demo-container {
            max-width: 600px;
            margin: 0 auto;
        }

        #selectable {
            list-style: none;
            margin: 0;
            padding: 0;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            min-height: 300px;
        }

        #selectable li {
            margin: 5px;
            padding: 15px;
            font-size: 18px;
            background: #e3f2fd;
            border: 2px solid #1976d2;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        #selectable li.ui-selected {
            background: #1976d2;
            color: white;
            border-color: #0d47a1;
        }

        .status {
            background: #fff3cd;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>✅ Selectable - Selenium Practice</h1>

    <div class="demo-container">
        <ul id="selectable">
            <li class="ui-selectee">Item 1</li>
            <li class="ui-selectee">Item 2</li>
            <li class="ui-selectee">Item 3</li>
            <li class="ui-selectee">Item 4</li>
            <li class="ui-selectee">Item 5</li>
            <li class="ui-selectee">Item 6</li>
        </ul>

        <div class="status">
            <h3>📊 Selection Status</h3>
            <div id="selected-status">0 items selected</div>
            <p><strong>Instructions:</strong> CTRL+Click to select, SHIFT+Click for range, Click empty area to clear</p>
        </div>
    </div>

    <script>
        $("#selectable").selectable({
            selected: function () {
                updateStatus();
            },
            unselected: function () {
                updateStatus();
            }
        });

        function updateStatus() {
            const count = $('#selectable .ui-selected').length;
            const text = count === 1 ? '1 item selected' : count + ' items selected';
            $('#selected-status').text(text);
        }

        // Click en área vacía limpia
        $('#selectable').click(function (e) {
            if (e.target === this) {
                $('#selectable li').removeClass('ui-selected');
                updateStatus();
            }
        });
    </script>
</body>

</html>
