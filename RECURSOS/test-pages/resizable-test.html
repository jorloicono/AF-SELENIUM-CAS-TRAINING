<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Resizable - Selenium Practice</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f0f2f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .demo-container {
            text-align: center;
            margin: 50px 0;
        }

        .status {
            background: #e8f4fd;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
        }

        #resizable {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #007cba, #28a745);
            margin: 0 auto;
            border: 3px solid #333;
            position: relative;
        }

        .ui-resizable-handle {
            background: #ff6b6b !important;
            border: 2px solid #fff;
            width: 20px !important;
            height: 20px !important;
        }

        .ui-resizable-se {
            bottom: -10px;
            right: -10px;
        }

        #size-status {
            font-size: 24px;
            font-weight: bold;
            color: #007cba;
        }
    </style>
</head>

<body>
    <h1>🔄 Resizable - Selenium Practice</h1>

    <div class="demo-container">
        <div id="resizable" class="ui-resizable"></div>
        <div class="status">
            <h3>📏 Current Size</h3>
            <div id="size-status">200px x 200px</div>
            <p><strong>Goal:</strong> Drag red handle (SE corner) to 450px x 450px</p>
        </div>
    </div>

    <script>
        $("#resizable").resizable({
            handles: "se",
            resize: function (event, ui) {
                const width = Math.round(ui.size.width);
                const height = Math.round(ui.size.height);
                $('#size-status').text(width + 'px x ' + height + 'px');
            }
        });
    </script>
</body>

</html>
