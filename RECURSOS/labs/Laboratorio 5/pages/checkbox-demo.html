<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Checkbox Demo</title>
</head>

<body>
    <h1>Checkbox Demo</h1><button id="checkAll" onclick="checkAll()">Check All</button><br><br><input type="checkbox"
        id="cb1"><label>Checkbox 1</label><br><input type="checkbox" id="cb2"><label>Checkbox 2</label>
    <script>function checkAll() { setTimeout(() => { document.getElementById('cb1').checked = true; document.getElementById('cb2').checked = true; }, 400); }</script>
</body>

</html>
